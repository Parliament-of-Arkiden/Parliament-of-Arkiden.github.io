<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');
    .content {
        width: 40vw;
        display: flex;
        flex-direction: column;
        background: #f4f4f4;
        border: dashed 1px #999;
        padding: 5px;
        box-sizing: border-box;
        align-self: center;
        margin-bottom: 3vh;
    }

    @media (max-width: 768px) {
        .content {
            width: 80vw;
        }
    }

    footer {
        background: #f4f4f4;
        display: flex;
        flex-direction: column;
        margin-top: auto;
    }
    </style>
    <title>Arkiden</title>
</head>
<body style="margin: 0; min-height: 100vh;display: flex; justify-content: center; background: #fff; flex-direction: column; color: rgb(0, 0, 0); font-family: 'JetBrains Mono', monospace;">
    <h2 style="align-self: center; margin-bottom: 5vh;">Republic of Arkiden</h2>
    <div class="content" style="margin-bottom: 3vh;" id="description"></div>
    <div class="content" id="constitution"></div>
    <div class="content" style="margin-bottom: 3vh;" id="laws"></div>
    <div class="content" id="plaws"></div>
    <script type="module">
        import { marked } from "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js";
        const constitutionurl = "https://raw.githubusercontent.com/Parliament-of-Arkiden/Parliament-of-Arkiden.github.io/main/CONSTITUTION/index.md";
        const constitutionmarkdown = await fetch(constitutionurl).then(r => r.text());
        document.getElementById("constitution").innerHTML = marked.parse(constitutionmarkdown);
        
        const descriptionurl = "https://raw.githubusercontent.com/Parliament-of-Arkiden/Parliament-of-Arkiden.github.io/main/README.md";
        const descriptionmarkdown = await fetch(descriptionurl).then(r => r.text());
        document.getElementById("description").innerHTML = marked.parse(descriptionmarkdown);
        
        const lawsurl = "https://raw.githubusercontent.com/Parliament-of-Arkiden/Parliament-of-Arkiden.github.io/main/LAWS/PASSED/index.md";
        const lawsmarkdown = await fetch(lawsurl).then(r => r.text());
        document.getElementById("laws").innerHTML = marked.parse(lawsmarkdown);
        
        const plawsurl = "https://raw.githubusercontent.com/Parliament-of-Arkiden/Parliament-of-Arkiden.github.io/main/LAWS/PROPOSED/index.md";
        const plawsmarkdown = await fetch(plawsurl).then(r => r.text());
        document.getElementById("plaws").innerHTML = marked.parse(plawsmarkdown);
    </script>
</body>
<footer>
    <a href="mailto:Parliament.Arkiden@proton.me?body=Dear%20Parliament%20%26%20Administration%20of%20Arkiden%2C%0A%0AMessage%0A%0ASincerly%2C%0AName" style="align-self: center; color: black;">✉ parliament.arkiden@proton.me</a>
    <a style="align-self: center; padding-bottom: 0.5em;">© 2026, Republic of Arkiden's Administration</a>
</footer>
</html>
